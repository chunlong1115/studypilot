{% extends "base.html" %}
{% block title %}忘记密码 - 智学伴 StudyPilot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-3" style="color: #4A90D9;">
                    <i class="bi bi-key me-2"></i>忘记密码
                </h3>
                <p class="text-muted text-center small mb-4">输入注册邮箱，我们将发送密码重置链接</p>

                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">注册邮箱</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="name@example.com" required autofocus>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3" style="background-color: #4A90D9; border-color: #4A90D9;">
                        发送重置邮件
                    </button>
                </form>

                <div class="text-center">
                    <a href="{{ url_for('auth.login') }}" class="small">
                        <i class="bi bi-arrow-left"></i> 返回登录
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
