{% extends "base.html" %}
{% block title %}个人中心 - 智学伴 StudyPilot{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h4 class="mb-4" style="color: #4A90D9;">
                    <i class="bi bi-person-gear me-2"></i>个人中心
                </h4>

                <form method="POST" enctype="multipart/form-data">
                    <!-- 头像 -->
                    <div class="text-center mb-4">
                        <div class="position-relative d-inline-block">
                            {% if current_user.avatar %}
                            <img src="{{ url_for('static', filename=current_user.avatar) }}"
                                 class="rounded-circle border" width="100" height="100"
                                 style="object-fit: cover; border-color: #4A90D9 !important;">
                            {% else %}
                            <div class="rounded-circle border d-flex align-items-center justify-content-center bg-primary-light"
                                 style="width: 100px; height: 100px; border-color: #4A90D9 !important; background-color: #EBF2FA;">
                                <i class="bi bi-person fs-1" style="color: #4A90D9;"></i>
                            </div>
                            {% endif %}
                        </div>
                        <div class="mt-2">
                            <label class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-camera"></i> 更换头像
                                <input type="file" name="avatar" accept=".png,.jpg,.jpeg,.gif"
                                       class="d-none" onchange="this.form.submit()">
                            </label>
                        </div>
                    </div>

                    <!-- 基本信息 -->
                    <div class="mb-3">
                        <label for="username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ current_user.username }}" required maxlength="64">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">邮箱</label>
                        <input type="text" class="form-control" id="email"
                               value="{{ current_user.email }}" disabled>
                        <div class="form-text">邮箱暂不支持修改</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">注册时间</label>
                        <input type="text" class="form-control"
                               value="{{ current_user.created_at.strftime('%Y-%m-%d %H:%M') if current_user.created_at else '-' }}" disabled>
                    </div>

                    <button type="submit" class="btn btn-primary" style="background-color: #4A90D9; border-color: #4A90D9;">
                        <i class="bi bi-check-lg"></i> 保存修改
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
