{% extends "base.html" %}
{% block title %}重置密码 - 智学伴 StudyPilot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center mb-4" style="color: #4A90D9;">
                    <i class="bi bi-lock me-2"></i>重置密码
                </h3>

                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="至少 6 位" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="再次输入新密码" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100" style="background-color: #4A90D9; border-color: #4A90D9;">
                        重置密码
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
